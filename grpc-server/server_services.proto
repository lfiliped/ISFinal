syntax = "proto3";
package server_services;

// Request message for SendFile
message SendFileRequestBody {
  bytes file = 1; // DTD file as bytes
  string file_mime = 2;
  string file_name = 3;
}

// Response message for SendFile
message SendFileResponseBody {
  bool success = 1;
}

// Request message for SendFileChunks
message SendFileChunksRequest {
  bytes data = 1; // The chunk of the file
  string file_name = 2; // File name (optional, sent in the first chunk or metadata)
}

// Response message for SendFileChunks
message SendFileChunksResponse {
  bool success = 1; // Indicates if the upload was successful
  string message = 2; // Additional status message
}

// Request and Response for ConvertCSVToXML
message ConvertCSVToXMLRequest {
  string file_name = 1; // Nome do arquivo CSV a ser convertido
}

message ConvertCSVToXMLResponse {
  bool success = 1; // Indicates if the conversion was successful
  string message = 2; // Additional status message
}

// Request and Response for ValidateXML
message ValidateXMLRequest {
  string xml_file_name = 1; // Nome do arquivo XML a ser validado
  string xsd_file_name = 2; // Nome do arquivo XSD para validação
}

message ValidateXMLResponse {
  bool success = 1; // Indicates if the validation was successful
  string message = 2; // Additional status message
}

// Request message for TextSearch
message TextSearchRequest {
  string xml_file_name = 1; // Nome do arquivo XML a ser pesquisado
  string search_term = 2;   // Termo a ser pesquisado no XML
}

// Response message for TextSearch
message TextSearchResponse {
  repeated string results = 1; // Lista de strings com os elementos encontrados
}

// Request message for SortXML
message SortXMLRequest {
  string xml_file_name = 1; // Nome do arquivo XML a ser ordenado
  string sort_by = 2;       // Nome do campo pelo qual ordenar
  string order = 3;         // "asc" ou "desc" para ordem
}

// Response message for SortXML
message SortXMLResponse {
  bool success = 1;         // Indica se a ordenação foi bem-sucedida
  string message = 2;       // Mensagem adicional
  string sorted_xml = 3;    // XML ordenado como string
}

message ListXMLFilesRequest {}

message ListXMLFilesResponse {
  repeated string file_names = 1;
}

// NOVO: Request message for ListCSVFiles
message ListCSVFilesRequest {}

// NOVO: Response message for ListCSVFiles
message ListCSVFilesResponse {
  repeated string file_names = 1;
}

// Service definition
service SendFileService {
  rpc SendFile (SendFileRequestBody) returns (SendFileResponseBody);
  rpc SendFileChunks (stream SendFileChunksRequest) returns (SendFileChunksResponse);
  rpc ConvertCSVToXML (ConvertCSVToXMLRequest) returns (ConvertCSVToXMLResponse);
  rpc ValidateXML (ValidateXMLRequest) returns (ValidateXMLResponse);
  rpc TextSearch (TextSearchRequest) returns (TextSearchResponse);
  rpc SortXML (SortXMLRequest) returns (SortXMLResponse);
  rpc ListXMLFiles (ListXMLFilesRequest) returns (ListXMLFilesResponse);
  rpc ListCSVFiles (ListCSVFilesRequest) returns (ListCSVFilesResponse);
}
